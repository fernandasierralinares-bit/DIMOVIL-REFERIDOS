<footer>

    DIMOVIL © 2026

</footer>



<script>

/* =====================================================
   CONFIGURACIÓN DE SUPABASE
===================================================== */


/*
   TU URL DE SUPABASE
*/

const SUPABASE_URL =
    "https://myuerncwcvrcqzjbntos.supabase.co";


/*
   PEGA AQUÍ TU PUBLISHABLE KEY

   Debe comenzar con:

   sb_publishable_

   NO uses la Secret Key.
*/

const SUPABASE_KEY =
    "PEGA_AQUI_TU_PUBLISHABLE_KEY";


/*
   CONEXIÓN
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   ELEMENTOS
===================================================== */

const formulario =
    document.getElementById("formulario");

const btnCrear =
    document.getElementById("btnCrear");

const mensaje =
    document.getElementById("mensaje");

const tablaRegistros =
    document.getElementById("tablaRegistros");



/* =====================================================
   MENSAJE
===================================================== */

function mostrarMensaje(
    texto,
    tipo = "exito"
) {

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

}



/* =====================================================
   FORMATEAR FECHA
===================================================== */

function formatearFecha(fecha) {

    if (!fecha) {
        return "";
    }

    const partes =
        fecha.split("-");

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}



/* =====================================================
   CREAR CITA
===================================================== */

formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* DATOS */

        const nombre =
            document
                .getElementById("nombre")
                .value
                .trim();


        const numero =
            document
                .getElementById("numero")
                .value
                .trim();


        const fecha =
            document
                .getElementById("fecha")
                .value;


        const vendedor =
            document
                .getElementById("vendedor")
                .value
                .trim();


        const recomendado =
            document
                .getElementById("recomendado")
                .value
                .trim();


        const regalo =
            document
                .getElementById("regalo")
                .value;


        const referidoSeleccionado =
            document.querySelector(
                'input[name="referido"]:checked'
            );


        const referido =
            referidoSeleccionado
                ? referidoSeleccionado.value
                : "";



        /* VALIDACIÓN DEL TELÉFONO */

        const numeroLimpio =
            numero.replace(/\D/g, "");


        if (
            numeroLimpio.length !== 10
        ) {

            mostrarMensaje(
                "El número debe tener 10 dígitos.",
                "error"
            );

            return;

        }



        /* BOTÓN */

        btnCrear.disabled = true;

        btnCrear.textContent =
            "Guardando cita...";



        try {


            /* =================================
               INSERTAR EN SUPABASE
            ================================= */

            const {
                data,
                error
            } = await supabaseClient
                .from("dimovil")
                .insert([

                    {

                        nombre: nombre,

                        numero: numeroLimpio,

                        fecha: fecha,

                        vendedor: vendedor,

                        referido: referido,

                        recomendado:
                            recomendado || null,

                        regalo: regalo

                    }

                ])
                .select()
                .single();



            /* ERROR */

            if (error) {

                console.error(
                    "Error Supabase:",
                    error
                );

                throw error;

            }



            /* =================================
               FELICITACIÓN
            ================================= */

            alert(

                "🎉 ¡FELICIDADES!\n\n" +

                "Tu cita fue creada correctamente.\n\n" +

                "👤 Cliente: " +
                nombre +
                "\n\n" +

                "📅 Fecha: " +
                formatearFecha(fecha) +
                "\n\n" +

                "🎁 A partir de ahora tu cliente " +
                "podrá obtener increíbles regalos."

            );



            /* =================================
               WHATSAPP
            ================================= */

            enviarWhatsApp(
                nombre,
                numeroLimpio,
                fecha,
                regalo
            );



            /* =================================
               LIMPIAR FORMULARIO
            ================================= */

            formulario.reset();



            mostrarMensaje(
                "✅ Cita guardada correctamente.",
                "exito"
            );



            /* ACTUALIZAR TABLA */

            cargarRegistros();



        }

        catch (error) {


            console.error(error);


            mostrarMensaje(

                "❌ No se pudo guardar la cita. " +
                "Revisa la conexión con Supabase " +
                "y las políticas RLS.",

                "error"

            );

        }


        finally {

            btnCrear.disabled = false;

            btnCrear.textContent =
                "🎉 Crear cita";

        }

    }
);



/* =====================================================
   WHATSAPP
===================================================== */

function enviarWhatsApp(
    nombre,
    numero,
    fecha,
    regalo
) {


    let telefono =
        numero.replace(/\D/g, "");


    /*
       México
    */

    if (
        telefono.length === 10
    ) {

        telefono =
            "52" +
            telefono;

    }


    const mensajeWhatsApp =

        "¡Hola " +
        nombre +
        "! 👋\n\n" +

        "Te confirmamos que tu cita con " +
        "DIMOVIL ha sido registrada correctamente. 📱💙\n\n" +

        "📅 Fecha: " +
        formatearFecha(fecha) +
        "\n\n" +

        "🎁 Regalo seleccionado: " +
        regalo +
        "\n\n" +

        "¡Te esperamos! 🎉\n\n" +

        "Gracias por confiar en DIMOVIL.";


    const url =

        "https://wa.me/" +
        telefono +
        "?text=" +
        encodeURIComponent(
            mensajeWhatsApp
        );


    window.open(
        url,
        "_blank"
    );

}



/* =====================================================
   MOSTRAR / OCULTAR REGISTROS
===================================================== */

function mostrarRegistros() {


    const registros =
        document.getElementById(
            "registros"
        );


    if (
        registros.style.display ===
        "block"
    ) {

        registros.style.display =
            "none";

        return;

    }


    registros.style.display =
        "block";


    cargarRegistros();


    registros.scrollIntoView({
        behavior: "smooth"
    });

}



/* =====================================================
   CARGAR REGISTROS DESDE SUPABASE
===================================================== */

async function cargarRegistros() {


    tablaRegistros.innerHTML = `

        <tr>

            <td colspan="7">

                🔄 Cargando...

            </td>

        </tr>

    `;


    try {


        const {
            data,
            error
        } = await supabaseClient
            .from("dimovil")
            .select(
                "id,nombre,numero,fecha,vendedor,referido,recomendado,regalo"
            )
            .order(
                "fecha",
                {
                    ascending: true
                }
            );



        if (error) {

            throw error;

        }



        /* SIN REGISTROS */

        if (
            !data ||
            data.length === 0
        ) {

            tablaRegistros.innerHTML = `

                <tr>

                    <td colspan="7">

                        📭 No hay citas registradas.

                    </td>

                </tr>

            `;

            return;

        }



        /* LIMPIAR */

        tablaRegistros.innerHTML =
            "";



        /* CREAR FILAS */

        data.forEach(
            function(cita) {


                const fila =
                    document.createElement(
                        "tr"
                    );


                fila.innerHTML = `

                    <td>
                        ${escaparHTML(
                            cita.nombre
                        )}
                    </td>

                    <td>
                        ${escaparHTML(
                            cita.numero
                        )}
                    </td>

                    <td>
                        ${formatearFecha(
                            cita.fecha
                        )}
                    </td>

                    <td>
                        ${escaparHTML(
                            cita.vendedor
                        )}
                    </td>

                    <td>
                        ${escaparHTML(
                            cita.referido
                        )}
                    </td>

                    <td>
                        ${
                            cita.recomendado
                                ? escaparHTML(
                                    cita.recomendado
                                )
                                : "—"
                        }
                    </td>

                    <td>
                        🎁 ${
                            escaparHTML(
                                cita.regalo
                            )
                        }
                    </td>

                `;


                tablaRegistros.appendChild(
                    fila
                );

            }
        );


    }

    catch (error) {


        console.error(
            "Error al consultar:",
            error
        );


        tablaRegistros.innerHTML = `

            <tr>

                <td colspan="7">

                    ❌ No se pudieron cargar
                    los registros.

                </td>

            </tr>

        `;

    }

}



/* =====================================================
   SEGURIDAD BÁSICA PARA MOSTRAR TEXTO
===================================================== */

function escaparHTML(texto) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   FECHA MÍNIMA
===================================================== */

/*
   Evita seleccionar fechas pasadas.
*/

const campoFecha =
    document.getElementById(
        "fecha"
    );


const hoy =
    new Date();


const año =
    hoy.getFullYear();


const mes =
    String(
        hoy.getMonth() + 1
    ).padStart(
        2,
        "0"
    );


const dia =
    String(
        hoy.getDate()
    ).padStart(
        2,
        "0"
    );


campoFecha.min =
    `${año}-${mes}-${dia}`;



/* =====================================================
   FIN
===================================================== */

</script>


</body>

</html>
```
